<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0d;
        font-family: monospace, sans-serif;
        color: #e6e2d8;
      }
      #game-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0d;
      }
      #unity-canvas {
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        display: block;
        background: #0d0d12;
        outline: none;
      }
      #loading-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0d;
        gap: 16px;
        z-index: 10;
        padding: 24px;
        text-align: center;
      }
      #loading-title {
        font-size: 20px;
        letter-spacing: 2px;
        color: #ebb033;
        font-weight: bold;
      }
      #loading-subtitle {
        font-size: 13px;
        color: #9ca0ab;
      }
      #progress-track {
        width: min(360px, 80vw);
        height: 14px;
        border: 2px solid #338ce0;
        background: #14141a;
        padding: 2px;
      }
      #progress-fill {
        width: 0%;
        height: 100%;
        background: #ebb033;
        transition: width 0.1s linear;
      }
      #loading-percent {
        font-size: 12px;
        color: #e6e2d8;
      }
      #error-banner {
        display: none;
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: #7a1c1c;
        color: #fff;
        padding: 10px 16px;
        border: 1px solid #d44;
        font-size: 13px;
        z-index: 20;
        max-width: 90vw;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <div id="loading-overlay">
        <div id="loading-title">VOCES INTERNAS: SANTA FELIPINA</div>
        <div id="loading-subtitle">Cargando recursos del juego...</div>
        <div id="progress-track">
          <div id="progress-fill"></div>
        </div>
        <div id="loading-percent">0%</div>
      </div>
      <div id="error-banner"></div>
    </div>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingOverlay = document.querySelector("#loading-overlay");
      const progressFill = document.querySelector("#progress-fill");
      const loadingPercent = document.querySelector("#loading-percent");
      const errorBanner = document.querySelector("#error-banner");

      function focusCanvas() {
        if (canvas) canvas.focus();
      }
      window.addEventListener("pointerdown", focusCanvas);
      window.addEventListener("keydown", focusCanvas);

      const config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
      };

      createUnityInstance(canvas, config, (progress) => {
        const pct = Math.min(100, Math.round(progress * 100));
        progressFill.style.width = pct + "%";
        loadingPercent.textContent = pct + "%";
      }).then(() => {
        loadingOverlay.style.display = "none";
        focusCanvas();
      }).catch((message) => {
        errorBanner.style.display = "block";
        errorBanner.textContent = "Error al iniciar el juego: " + message;
      });
    </script>
  </body>
</html>
